name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-rust-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
    # first cargo call.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Build and test
      run: |
        cargo build --verbose --workspace --all-features
        cargo test --verbose --workspace --all-features

  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
    # first cargo call.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Write credentials file
      env:
        CREDENTIALS_JSON: ${{ secrets.SFDC_CREDENTIALS }}
      run: |
        if [ -z "$CREDENTIALS_JSON" ]; then
          echo "::error::SFDC_CREDENTIALS secret is not set"
          exit 1
        fi
        printf '%s' "$CREDENTIALS_JSON" > "$RUNNER_TEMP/sfdc_credentials.json"
    - name: Run integration tests
      env:
        SFDC_CREDENTIALS: ${{ runner.temp }}/sfdc_credentials.json
      # The live tests are `#[ignore]`d; `--ignored` runs only them, since the
      # mocks already ran in `test-rust-latest`. `--test '*'` picks up every
      # file under `salesforce-core/tests/` without editing this workflow.
      run: cargo test --verbose --all-features -p salesforce_core --test '*' -- --ignored

  test-rust-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # `rust-toolchain.toml` pins stable and takes precedence over the default
    # toolchain this action sets, so the cargo calls below select nightly
    # explicitly.
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Build and test
      run: |
        cargo +nightly build --verbose --workspace --all-features
        cargo +nightly test --verbose --workspace --all-features

  # Enforces the `rust-version` (MSRV) declared in `Cargo.toml` by
  # compiling the workspace with that exact toolchain. Without this job the
  # field is a promise, not a contract — a dependency bump that raises the
  # minimum would only be caught by a downstream consumer building on an
  # older Rust.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.89"
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Compile with MSRV
      run: cargo +1.89 check --workspace --all-targets --all-features --locked --verbose

  # Builds each crate on its own, like `cargo publish`.
  package:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
    # first cargo call.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Package and verify each crate
      run: cargo package --workspace --locked
