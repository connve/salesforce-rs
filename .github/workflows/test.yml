name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-rust-latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Reads channel + components from `rust-toolchain.toml`.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Add rustfmt and build
      run: |
        rustup component add rustfmt
        cargo build --verbose
        cargo test --verbose
        cargo fmt --all

  integration-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Reads channel + components from `rust-toolchain.toml`.
    - uses: dtolnay/rust-toolchain@stable
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Write credentials file
      env:
        CREDENTIALS_JSON: ${{ secrets.SFDC_CREDENTIALS }}
      run: |
        if [ -z "$CREDENTIALS_JSON" ]; then
          echo "::error::SFDC_CREDENTIALS secret is not set"
          exit 1
        fi
        printf '%s' "$CREDENTIALS_JSON" > "$RUNNER_TEMP/sfdc_credentials.json"
    - name: Run integration tests
      env:
        SFDC_CREDENTIALS: ${{ runner.temp }}/sfdc_credentials.json
      # `--test '*'` picks up every file under `salesforce-core/tests/`, so a
      # new integration test file runs here without editing this workflow.
      run: cargo test --verbose -p salesforce_core --test '*'

  test-rust-nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    # Explicit nightly override — `rust-toolchain.toml` pins stable, but
    # this job intentionally exercises the nightly channel.
    - uses: dtolnay/rust-toolchain@nightly
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Add rustfmt and build
      run: |
        rustup component add rustfmt
        cargo build --verbose
        cargo test --verbose
        cargo fmt --all

  # Enforces the `rust-version` (MSRV) declared in `Cargo.toml` by
  # compiling the workspace with that exact toolchain. Without this job the
  # field is a promise, not a contract — a dependency bump that raises the
  # minimum would only be caught by a downstream consumer building on an
  # older Rust.
  test-msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: "1.88"
    - name: Install system dependencies
      run: |
        sudo apt update -qq
        sudo apt-get -qq install pkg-config libssl-dev protobuf-compiler git
    - name: Compile with MSRV
      run: cargo +1.88 check --workspace --all-targets --all-features --locked --verbose
