name: Security Audit

on:
  pull_request:
    branches:
      - main
  schedule:
    # Run security audit daily at 9:00 AM UTC
    - cron: '0 9 * * *'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # rustup installs the toolchain pinned in `rust-toolchain.toml` on the
      # first cargo call.
      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        # Ignored advisories, if any, are listed in .cargo/audit.toml.
        run: cargo audit

