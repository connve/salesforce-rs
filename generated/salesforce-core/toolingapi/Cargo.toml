[package]
name = "salesforce_core_toolingapi"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generated Salesforce Tooling API client (used by salesforce_core)"
repository.workspace = true

[lib]
name = "salesforce_core_toolingapi"
path = "src/lib.rs"

# Not `workspace = true`: the code is emitted by progenitor, so the workspace
# lints would fail on output we don't control.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"

[lints.clippy]
all = "allow"

[lints.rustdoc]
broken_intra_doc_links = "allow"

[dependencies]
reqwest = { workspace = true }
serde = { workspace = true }
url = { workspace = true }
progenitor-client = { workspace = true }

[build-dependencies]
progenitor = { workspace = true }
openapiv3 = { workspace = true }
serde_yaml = { workspace = true }
