[package]
name = "salesforce_core_pubsubapi"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generated Salesforce Pub/Sub API gRPC client (used by salesforce_core)"
repository.workspace = true

[package.metadata.docs.rs]
# protoc is preinstalled on docs.rs builders.
all-features = true

[lib]
name = "salesforce_core_pubsubapi"
path = "src/lib.rs"

# Not `workspace = true`: the code is emitted by tonic-build, so the workspace
# lints would fail on output we don't control.
[lints.rust]
dead_code = "allow"
unused_imports = "allow"

[lints.clippy]
all = "allow"

[lints.rustdoc]
broken_intra_doc_links = "allow"

[dependencies]
prost = { workspace = true }
# Needed for `String`/`Vec<u8>` in the derived impls.
serde = { workspace = true, features = ["std"] }
tonic = { workspace = true }
bytes = { workspace = true }
tokio-stream = { workspace = true }
tonic-prost = { workspace = true }

[build-dependencies]
tonic-build = { workspace = true }
prost-build = { workspace = true }
tonic-prost-build = { workspace = true }
